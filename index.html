<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="时间账本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="本地优先的时间统计应用，支持二级标签分类、导出导入同步">
<title>时间账本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#14161a; --muted:#6b7280; --line:#e9ebef;
    --soft:#f0f1f4; --accent:#4f46e5; --accent-2:#6366f1; --danger:#e5484d;
    --shadow:0 1px 2px rgba(16,18,24,.04), 0 8px 24px rgba(16,18,24,.06);
    --r:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#171a20; --text:#e8eaf0; --muted:#98a1b0; --line:#252932;
      --soft:#1e222a; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  input,select{ font:inherit; color:inherit; }
  .num{ font-variant-numeric:tabular-nums; }

  .app{ max-width:560px; margin:0 auto; padding:0 16px 104px; }

  /* 顶栏 */
  .hdr{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:22px 2px 14px; }
  .hdr-date{ font-size:15px; font-weight:600; letter-spacing:.01em; }
  .hdr-total{ font-size:26px; font-weight:700; letter-spacing:-.02em; margin-top:2px; }
  .hdr-total small{ font-size:13px; font-weight:500; color:var(--muted); margin-left:6px; letter-spacing:0; }
  .hdr-right{ text-align:right; color:var(--muted); font-size:12px; line-height:1.35; padding-bottom:3px; }

  /* 计时卡 */
  .timer-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:12px; min-height:66px;
  }
  .t-dot{ width:9px; height:9px; border-radius:50%; background:#c3c8d2; flex:none; }
  .t-dot.on{ background:var(--accent); box-shadow:0 0 0 4px rgba(79,70,229,.14); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.45 } }
  .t-body{ flex:1; min-width:0; }
  .t-label{ font-size:13px; color:var(--muted); }
  .t-cat{ font-size:15px; font-weight:600; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-cat .sep{ color:var(--muted); font-weight:400; margin:0 5px; }
  .t-time{ font-size:22px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .t-switch{ font-size:12px; color:var(--accent); padding:7px 10px; border-radius:9px; background:rgba(79,70,229,.08); flex:none; }

  /* 大按钮 */
  .start-wrap{ display:grid; place-items:center; padding:22px 0 18px; }
  .start-btn{
    width:158px; height:158px; border-radius:50%;
    background:linear-gradient(158deg,#6366f1,#4f46e5 62%,#4338ca);
    color:#fff; font-size:21px; font-weight:650; letter-spacing:.02em;
    box-shadow:0 14px 34px rgba(79,70,229,.32), inset 0 1px 0 rgba(255,255,255,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .start-btn:active{ transform:scale(.955); box-shadow:0 6px 18px rgba(79,70,229,.3); }
  .start-btn .sb-sub{ font-size:11px; font-weight:500; opacity:.72; letter-spacing:.06em; }
  .start-btn.running{
    background:linear-gradient(158deg,#f26d71,#e5484d 60%,#cf3439);
    box-shadow:0 14px 34px rgba(229,72,77,.3), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn svg{ width:22px; height:22px; margin-bottom:2px; }

  /* 快捷动作 */
  .quick{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .qa{
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:11px 6px; display:flex; flex-direction:column; align-items:center; gap:5px;
    font-size:12.5px; font-weight:550; color:var(--text); box-shadow:var(--shadow);
    transition:transform .12s ease, background .12s ease;
  }
  .qa:active{ transform:scale(.965); background:var(--soft); }
  .qa svg{ width:18px; height:18px; color:var(--accent); }
  .qa.primary{ border-color:rgba(79,70,229,.25); background:rgba(79,70,229,.055); }

  /* 常用标签 */
  .recent{ margin-top:20px; }
  .sec-label{ font-size:12px; font-weight:650; color:var(--muted); letter-spacing:.06em; margin-bottom:9px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:1px 0 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:9px 12px; font-size:13.5px; font-weight:550; box-shadow:var(--shadow);
    white-space:nowrap; transition:transform .12s ease;
  }
  .chip:active{ transform:scale(.955); }
  .chip i{ width:7px; height:7px; border-radius:2px; background:var(--c,#94a3b8); flex:none; }
  .chip .chip-cat{ font-size:11px; color:var(--muted); font-weight:450; }

  /* 列表 */
  .list-sec{ margin-top:22px; }
  .sec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .day-nav{ display:flex; align-items:center; gap:2px; }
  .day-nav button{ width:26px; height:26px; border-radius:8px; display:grid; place-items:center; color:var(--muted); font-size:15px; }
  .day-nav button:active{ background:var(--soft); }
  .day-nav button:disabled{ opacity:.28; }
  #listDayLabel{ font-size:15px; font-weight:650; min-width:64px; text-align:center; }
  .sec-head .sum{ font-size:12.5px; color:var(--muted); }
  .day-dayname{ font-size:12px; color:var(--muted); font-weight:500; }

  .entry{
    display:flex; gap:0; background:var(--card); border:1px solid var(--line);
    border-radius:13px; margin-bottom:8px; overflow:hidden; box-shadow:var(--shadow);
    transition:transform .1s ease;
  }
  .entry:active{ transform:scale(.99); }
  .entry-bar{ width:4px; flex:none; }
  .entry-main{ flex:1; padding:11px 13px; min-width:0; }
  .entry-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .entry-time{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .entry-dur{ font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .entry-cat{ font-size:14.5px; font-weight:600; margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .entry-cat i{ width:7px; height:7px; border-radius:2px; flex:none; }
  .entry-cat .sep{ color:var(--muted); font-weight:400; }
  .entry-note{ font-size:12.5px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-live .entry-dur{ color:var(--accent); }
  .warn-dot{ font-size:10px; color:#d97706; background:rgba(217,119,6,.12); border-radius:5px; padding:1px 5px; font-weight:600; }

  .empty{ text-align:center; color:var(--muted); font-size:13.5px; padding:34px 10px; background:var(--card); border:1px dashed var(--line); border-radius:13px; }

  /* 统计 */
  .seg{ display:flex; background:var(--soft); border-radius:12px; padding:3px; margin:6px 0 16px; }
  .seg button{ flex:1; padding:8px 4px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--muted); transition:.15s; }
  .seg button.on{ background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(16,18,24,.1); }
  .hero{ padding:6px 2px 20px; }
  .hero-num{ font-size:38px; font-weight:750; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; }
  .hero-meta{ font-size:13px; color:var(--muted); margin-top:5px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card-title{ font-size:13px; font-weight:650; color:var(--muted); letter-spacing:.04em; margin-bottom:14px; }

  .donut-wrap{ display:flex; align-items:center; gap:20px; }
  .donut{ width:132px; height:132px; border-radius:50%; position:relative; flex:none; display:grid; place-items:center; }
  .donut::after{ content:""; position:absolute; inset:24px; border-radius:50%; background:var(--card); }
  .donut-c{ position:relative; z-index:1; text-align:center; }
  .donut-c b{ display:block; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .donut-c span{ font-size:10.5px; color:var(--muted); }
  .legend{ flex:1; min-width:0; display:flex; flex-direction:column; gap:9px; }
  .lg-row{ display:flex; align-items:center; gap:7px; font-size:13px; }
  .lg-row i{ width:8px; height:8px; border-radius:2px; flex:none; }
  .lg-row .lg-n{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lg-row .lg-v{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; }

  .bar-row{ margin-bottom:11px; }
  .bar-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; gap:8px; }
  .bar-top .bn{ display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-top .bn i{ width:8px; height:8px; border-radius:2px; flex:none; }
  .bar-top .bv{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; flex:none; }
  .track{ height:7px; background:var(--soft); border-radius:4px; overflow:hidden; }
  .fill{ height:100%; border-radius:4px; transition:width .4s cubic-bezier(.4,0,.2,1); }

  .bars7{ display:flex; align-items:flex-end; gap:8px; height:112px; padding-top:6px; }
  .b7{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .b7 .bt{ flex:1; width:100%; display:flex; align-items:flex-end; }
  .b7 .bf{ width:100%; background:linear-gradient(180deg,var(--accent-2),var(--accent)); border-radius:5px 5px 2px 2px; min-height:2px; opacity:.9; }
  .b7 .bf.zero{ background:var(--soft); }
  .b7 .bl{ font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .b7 .bl.today{ color:var(--accent); font-weight:650; }

  /* 设置 */
  .row-btn{ display:flex; width:100%; align-items:center; justify-content:space-between; padding:12px 0; font-size:14.5px; border-top:1px solid var(--line); }
  .row-btn:first-of-type{ border-top:0; }
  .row-btn .rb-l{ display:flex; flex-direction:column; gap:2px; text-align:left; }
  .row-btn .rb-s{ font-size:12px; color:var(--muted); }
  .row-btn.danger{ color:var(--danger); }
  .row-btn .arrow{ color:var(--muted); font-size:13px; }
  .hint{ font-size:12.5px; color:var(--muted); line-height:1.65; margin:10px 0 0; }
  .hint b{ color:var(--text); font-weight:600; }

  .sync-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:#c3c8d2; margin-right:6px; vertical-align:middle; }
  .sync-dot.busy{ background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  .sync-dot.ok{ background:#10b981; }
  .sync-dot.err{ background:var(--danger); }
  .sync-line{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); margin-top:12px; }
  .sync-line .t{ flex:1; }
  .sync-line a{ color:var(--accent); font-size:12.5px; padding:4px 8px; border-radius:7px; background:rgba(79,70,229,.08); }
  .sync-err{ color:var(--danger); }

  .ce-cat{ padding:12px 0; border-top:1px solid var(--line); }
  .ce-cat:first-child{ border-top:0; padding-top:0; }
  .ce-row{ display:flex; align-items:center; gap:9px; }
  .ce-row input[type=color]{ width:24px; height:24px; padding:0; border:1px solid var(--line); border-radius:7px; background:none; cursor:pointer; flex:none; }
  .ce-name{ flex:1; min-width:0; border:1px solid var(--line); background:transparent; border-radius:8px; padding:6px 9px; font-size:14px; font-weight:600; }
  .ce-name:focus{ outline:none; border-color:var(--accent); background:var(--soft); }
  .ce-del{ font-size:12px; color:var(--muted); padding:5px 8px; border-radius:7px; }
  .ce-del:active{ background:var(--soft); color:var(--danger); }
  .ce-subs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; padding-left:33px; }
  .ce-sub{ display:inline-flex; align-items:center; gap:4px; background:var(--soft); border-radius:8px; padding:4px 6px 4px 9px; font-size:12.5px; }
  .ce-sub button{ color:var(--muted); font-size:14px; line-height:1; padding:1px 3px; border-radius:4px; }
  .ce-sub button:active{ color:var(--danger); }
  .ce-add{ font-size:12.5px; color:var(--accent); border:1px dashed rgba(79,70,229,.35); border-radius:8px; padding:4px 9px; }

  /* 底部 tab */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar-inner{ max-width:560px; margin:0 auto; display:flex; }
  @media (min-width:700px){
    .tabbar{
      left:50%; right:auto; transform:translateX(-50%);
      width:560px; max-width:calc(100vw - 32px);
      bottom:0; border:1px solid var(--line); border-bottom:0;
      border-radius:18px 18px 0 0;
    }
  }
  .tab{ flex:1; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10.5px; font-weight:550; }
  .tab svg{ width:21px; height:21px; }
  .tab.on{ color:var(--accent); }

  /* 抽屉 */
  .mask{ position:fixed; inset:0; background:rgba(10,12,18,.42); z-index:50; opacity:0; transition:opacity .2s; }
  .mask.show{ opacity:1; }
  @media (prefers-color-scheme: dark){ .mask{ background:rgba(0,0,0,.66); } }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51;
    background:var(--card); border-radius:22px 22px 0 0;
    max-height:86vh; display:flex; flex-direction:column;
    transform:translateY(102%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -8px 40px rgba(10,12,18,.16);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-in{ max-width:560px; width:100%; margin:0 auto; display:flex; flex-direction:column; min-height:0; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; flex:none; }
  .sheet-head b{ font-size:16px; font-weight:650; }
  .sheet-head button{ font-size:13px; color:var(--muted); padding:6px 8px; border-radius:8px; }
  .sheet-body{ overflow-y:auto; padding:0 20px 22px; -webkit-overflow-scrolling:touch; }

  .pk-group{ margin-bottom:16px; }
  .pk-title{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:650; color:var(--muted); letter-spacing:.05em; margin-bottom:9px; }
  .pk-title i{ width:8px; height:8px; border-radius:2px; }
  .pk-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .pk-chips .chip{ background:var(--soft); border-color:transparent; box-shadow:none; padding:10px 14px; font-size:14px; }
  .chip-new{ color:var(--accent); border:1px dashed rgba(79,70,229,.4) !important; background:transparent !important; }
  .chip-input{ width:112px; background:var(--soft); border:1px solid var(--accent); border-radius:11px; padding:10px 12px; font-size:14px; }
  .chip-input:focus{ outline:none; }

  /* 表单 */
  .fld{ margin-bottom:13px; }
  .fld label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; letter-spacing:.03em; }
  .fld input,.fld select{
    width:100%; background:var(--soft); border:1px solid transparent; border-radius:11px;
    padding:11px 12px; font-size:15px; appearance:none; -webkit-appearance:none;
  }
  .fld input:focus,.fld select:focus{ outline:none; border-color:var(--accent); background:var(--card); }
  .fld-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .dur-quick{ display:flex; gap:7px; margin:-4px 0 13px; flex-wrap:wrap; }
  .dur-quick button{ font-size:12.5px; padding:6px 11px; border-radius:8px; background:var(--soft); color:var(--muted); font-weight:550; }
  .dur-quick button:active{ background:rgba(79,70,229,.12); color:var(--accent); }
  .warn{ background:rgba(217,119,6,.1); color:#b45309; border-radius:10px; padding:9px 12px; font-size:12.5px; margin-bottom:13px; }
  @media (prefers-color-scheme: dark){ .warn{ color:#fbbf24; } }
  .actions{ display:flex; gap:9px; margin-top:6px; }
  .btn{ flex:1; padding:13px; border-radius:12px; font-size:15px; font-weight:650; text-align:center; }
  .btn.main{ background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(79,70,229,.28); }
  .btn.main:active{ transform:scale(.985); }
  .btn.sub{ background:var(--soft); color:var(--text); }
  .btn.del{ background:rgba(229,72,77,.1); color:var(--danger); flex:none; padding:13px 18px; }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px);
    background:rgba(22,24,30,.94); color:#fff; font-size:13.5px; padding:10px 16px; border-radius:11px;
    z-index:90; opacity:0; transition:.22s cubic-bezier(.4,0,.2,1); pointer-events:none; max-width:86vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (min-width:600px){
    .start-btn{ width:170px; height:170px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <div>
      <div class="hdr-date" id="hdrDate">—</div>
      <div class="hdr-total"><span id="hdrTotal">0m</span><small>今天</small></div>
    </div>
    <div class="hdr-right" id="hdrRight"></div>
  </header>

  <!-- 记录 -->
  <main id="view-record">
    <div class="timer-card">
      <span class="t-dot" id="tDot"></span>
      <div class="t-body">
        <div class="t-label" id="tLabel">未开始</div>
        <div class="t-cat" id="tCat">点下方按钮开始记录</div>
      </div>
      <div style="text-align:right">
        <div class="t-time num" id="tTime">00:00</div>
      </div>
      <button class="t-switch" id="btnSwitch" hidden>切换</button>
    </div>

    <div class="start-wrap">
      <button class="start-btn" id="btnStart">
        <svg viewBox="0 0 24 24" fill="currentColor" id="btnStartIcon"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
        <span id="btnStartTxt">开始</span>
        <span class="sb-sub" id="btnStartSub">记一笔</span>
      </button>
    </div>

    <div class="quick">
      <button class="qa primary" id="btnManual">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        补记
      </button>
      <button class="qa" id="btnExport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        导出
      </button>
      <button class="qa" id="btnImport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
        导入
      </button>
    </div>

    <div class="recent" id="recentWrap" hidden>
      <div class="sec-label">常用标签</div>
