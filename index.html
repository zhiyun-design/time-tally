<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  var DB_KEY = 'time-tally.v1';
  var SYNC_KEY = 'time-tally.sync.v1';
  var SCHEMA = 1;
  var DAY = 86400000;
  var DEMO = new URLSearchParams(location.search).has('demo');
  var INIT_VIEW = (function () {
    var v = new URLSearchParams(location.search).get('view');
    return (v === 'stats' || v === 'settings') ? v : 'record';
  })();

  var DEFAULT_CATS = [
    { name: '工作', color: '#4f6df5', subs: ['写代码', '开会', '沟通', '文档', '排障'] },
    { name: '学习', color: '#8b5cf6', subs: ['阅读', '课程', '练习', '笔记'] },
    { name: '生活', color: '#10b981', subs: ['吃饭', '家务', '通勤', '采买'] },
    { name: '运动', color: '#f59e0b', subs: ['跑步', '健身', '拉伸'] },
    { name: '休息', color: '#64748b', subs: ['午睡', '刷手机', '发呆'] }
  ];

  /* ================= 工具 ================= */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function uid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function normName(s) { return String(s == null ? '' : s).trim().toLowerCase(); }

  function fmtDur(ms) {
    var sec = Math.max(0, Math.round(ms / 1000));
    if (sec < 60) return sec > 0 ? sec + 's' : '0m';
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + 'h ' + pad(m) + 'm';
    return m + 'm';
  }
  function fmtDurLong(ms) {
    var min = Math.round(ms / 60000);
    if (min < 1) return '不足 1 分钟';
    var h = Math.floor(min / 60), m = min % 60;
    var out = '';
    if (h) out += h + ' 小时 ';
    if (m || !h) out += m + ' 分';
    return out.trim();
  }
  function fmtHMS(ms) {
    var sec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s);
  }
  function fmtClock(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtDayTitle(ts) {
    return (new Date(ts).getMonth() + 1) + '月' + new Date(ts).getDate() + '日';
  }
  function fmtDateFull(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + '日一二三四五六'[d.getDay()];
  }
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function startOfWeek(ts) {
    var d = new Date(startOfDay(ts));
    var wd = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - wd);
    return d.getTime();
  }
  function startOfMonth(ts) { var d = new Date(ts); d.setDate(1); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateInputVal(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function timeInputVal(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function parseLocal(dateStr, timeStr) {
    var a = String(dateStr).split('-').map(Number);
    var b = String(timeStr).split(':').map(Number);
    return new Date(a[0], a[1] - 1, a[2], b[0] || 0, b[1] || 0, 0, 0).getTime();
  }

  /* ================= 状态 ================= */
  var state = null;
  var storageOK = true;
  var listDay = 0;
  var range = 'today';
  var pickerMode = 'start';
  var editingId = null;
  var lastDayKey = dayKey(Date.now());

  // 同步配置单独存，不写进数据文件，避免导出时把 Token 带出去
  var syncCfg = { mode: 'off', lanUrl: '', gistToken: '', gistId: '', auto: true, rev: 0, lastAt: 0 };
  var syncState = { status: 'off', error: '', busy: false };
  var syncTimer = null;
  var suppressSync = false;

  function blankState() {
    return {
      v: SCHEMA,
      cats: DEFAULT_CATS.map(function (c) {
        return {
          id: uid(), name: c.name, color: c.color,
          subs: c.subs.map(function (n) { return { id: uid(), name: n }; })
        };
      }),
      entries: [],
      timer: null,
      meta: { recent: [], lastExportAt: 0 }
    };
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(DB_KEY); } catch (e) { storageOK = false; }
    var s = null;
    if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
    if (!s || !Array.isArray(s.cats) || !s.cats.length) s = blankState();

    s.entries = (Array.isArray(s.entries) ? s.entries : []).filter(function (e) {
      return e && e.id && typeof e.start === 'number';
    });
    s.cats = s.cats.filter(function (c) { return c && c.id; }).map(function (c) {
      c.name = String(c.name || '未命名');
      c.color = c.color || '#94a3b8';
      c.subs = (Array.isArray(c.subs) ? c.subs : []).filter(function (x) { return x && x.id; });
      return c;
    });
    if (!s.meta) s.meta = { recent: [], lastExportAt: 0 };
    if (!Array.isArray(s.meta.recent)) s.meta.recent = [];

    // 计时器失效修复
    if (s.timer) {
      var te = s.entries.find(function (x) { return x.id === s.timer.entryId; });
      if (!te || te.end != null) s.timer = null;
    }
    // 无人认领的未结束条目：收缩为 0 时长
    s.entries.forEach(function (e) {
      if (e.end == null && !(s.timer && s.timer.entryId === e.id)) {
        e.end = e.start;
        e.updatedAt = e.updatedAt || Date.now();
      }
    });
    return s;
  }

  function save() {
    if (DEMO) return; // 预览模式只读，不落盘
    try { localStorage.setItem(DB_KEY, JSON.stringify(state)); }
    catch (e) { storageOK = false; toast('无法写入本地存储，数据可能不会保存'); }
    if (!suppressSync) queueSync();
  }

  function demoState() {
    var s = blankState();
    var byName = {};
    s.cats.forEach(function (c) { byName[c.name] = c; });
    function ref(catName, subName) {
      var c = byName[catName];
      if (!c) return { c: '', s: '' };
      var sb = c.subs.filter(function (x) { return x.name === subName; })[0] || c.subs[0];
      return { c: c.id, s: sb ? sb.id : '' };
    }
    var now = Date.now();
    var t0 = startOfDay(now);
    var plan = [
      [0, 9 * 60 + 10, 55, '工作', '写代码'],
      [0, 10 * 60 + 15, 45, '工作', '开会'],
      [0, 11 * 60 + 5, 50, '工作', '排障'],
      [0, 12 * 60 + 10, 50, '生活', '吃饭'],
      [0, 13 * 60 + 40, 70, '工作', '写代码'],
      [0, 15 * 60, 40, '学习', '阅读'],
      [-1, 9 * 60 + 30, 90, '工作', '写代码'],
      [-1, 11 * 60 + 20, 40, '工作', '沟通'],
      [-1, 14 * 60, 60, '学习', '课程'],
      [-1, 19 * 60 + 30, 45, '运动', '跑步'],
      [-2, 10 * 60, 120, '工作', '写代码'],
      [-2, 14 * 60, 60, '学习', '练习'],
      [-2, 20 * 60, 40, '休息', '刷手机'],
      [-3, 9 * 60, 60, '工作', '开会'],
      [-3, 13 * 60, 90, '工作', '写代码'],
      [-3, 20 * 60, 40, '生活', '家务'],
      [-4, 9 * 60 + 30, 75, '工作', '写代码'],
      [-4, 16 * 60, 50, '学习', '阅读'],
      [-5, 10 * 60, 100, '工作', '写代码'],
      [-5, 15 * 60, 45, '生活', '采买'],
      [-6, 11 * 60, 60, '工作', '文档'],
      [-6, 18 * 60, 40, '运动', '健身']
    ];
    plan.forEach(function (p) {
      var st = t0 + p[0] * DAY + p[1] * 60000;
      var en = st + p[2] * 60000;
      if (st >= now) return;
      if (en > now) en = now;
      if (en - st < 60000) return;
      var r = ref(p[3], p[4]);
      s.entries.push({
        id: uid(), start: st, end: en, catId: r.c, subId: r.s,
        note: '', src: 'manual', createdAt: st, updatedAt: st, deletedAt: null
      });
    });
    s.meta.recent = [
      ref('工作', '写代码').s, ref('学习', '阅读').s, ref('工作', '开会').s,
      ref('生活', '吃饭').s, ref('运动', '跑步').s
    ].filter(Boolean);
    return s;
  }

  /* ================= 查询 ================= */
  function entryById(id) {
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].id === id) return state.entries[i];
    return null;
  }
  function findCat(id) {
    for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === id) return state.cats[i];
    return null;
  }
  function findSub(subId) {
    for (var i = 0; i < state.cats.length; i++) {
      var c = state.cats[i];
      for (var j = 0; j < c.subs.length; j++) {
        if (c.subs[j].id === subId) return { cat: c, sub: c.subs[j] };
      }
    }
    return null;
  }
  function catOfEntry(e) { return findCat(e.catId) || { name: '未分类', color: '#94a3b8', subs: [] }; }
  function subOfEntry(e) {
    var f = findSub(e.subId);
    return f ? f.sub : { name: '未标注', id: e.subId };
  }
  function activeEntry() {
    if (!state.timer) return null;
    var e = entryById(state.timer.entryId);
    return (e && e.end == null) ? e : null;
  }
  function liveEntries() {
    return state.entries.filter(function (e) { return !e.deletedAt; });
  }

  /* ================= 时间计算（纯函数） ================= */
  function entryEnd(e, now) { return e.end == null ? now : e.end; }

  function clipMs(e, from, to, now) {
    var s = Math.max(e.start, from);
    var en = Math.min(entryEnd(e, now), to);
    return en > s ? en - s : 0;
  }

  function sumRange(entries, from, to, now) {
    var t = 0;
    for (var i = 0; i < entries.length; i++) t += clipMs(entries[i], from, to, now);
    return t;
  }

  function groupRange(entries, from, to, now, keyFn) {
    var map = new Map();
    var total = 0;
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var d = clipMs(e, from, to, now);
      if (d <= 0) continue;
      total += d;
      var k = keyFn(e);
      var cur = map.get(k) || { key: k, ms: 0, count: 0 };
      cur.ms += d;
      cur.count += 1;
      map.set(k, cur);
    }
    return { total: total, items: Array.from(map.values()).sort(function (a, b) { return b.ms - a.ms; }) };
  }

  function rangeBounds(key, now) {
    if (key === 'today') return { from: startOfDay(now), to: now };
    if (key === 'week') return { from: startOfWeek(now), to: now };
    if (key === 'month') return { from: startOfMonth(now), to: now };
    var min = now, max = 0;
    for (var i = 0; i < state.entries.length; i++) {
      var e = state.entries[i];
      if (e.deletedAt) continue;
      if (e.start < min) min = e.start;
      var en = entryEnd(e, now);
      if (en > max) max = en;
    }
    if (!state.entries.length) return { from: startOfDay(now), to: now };
    return { from: startOfDay(min), to: Math.max(max, now) };
  }

  function overlaps(start, end, excludeId) {
    return state.entries.filter(function (e) {
      return !e.deletedAt && e.id !== excludeId && e.end != null && e.start < end && e.end > start;
    });
  }

  /* ================= 写入 ================= */
  function pushRecent(subId) {
    if (!subId) return;
    var r = state.meta.recent.filter(function (x) { return x !== subId; });
    r.unshift(subId);
    state.meta.recent = r.slice(0, 8);
  }

  function startTimer(catId, subId, at) {
    at = at || Date.now();
    if (state.timer) closeTimer(at);
    var e = {
      id: uid(), start: at, end: null, catId: catId, subId: subId,
      note: '', src: 'timer', createdAt: at, updatedAt: at, deletedAt: null
    };
    state.entries.push(e);
    state.timer = { entryId: e.id };
    pushRecent(subId);
    save();
  }

  function closeTimer(at) {
    if (!state.timer) return null;
    at = at || Date.now();
    var e = entryById(state.timer.entryId);
    state.timer = null;
    if (e && e.end == null) {
      var dur = at - e.start;
      if (dur < 1000) {
        // 太短，直接丢弃，避免垃圾记录
        state.entries = state.entries.filter(function (x) { return x.id !== e.id; });
      } else {
        e.end = at;
        e.updatedAt = at;
      }
    }
    save();
    return e;
  }

  function addEntry(start, end, catId, subId, note) {
    var now = Date.now();
    var e = {
      id: uid(), start: start, end: end, catId: catId, subId: subId,
      note: note || '', src: 'manual', createdAt: now, updatedAt: now, deletedAt: null
    };
    state.entries.push(e);
    pushRecent(subId);
    save();
    return e;
  }

  function updateEntry(id, patch) {
    var e = entryById(id);
    if (!e) return;
    Object.assign(e, patch, { updatedAt: Date.now() });
    save();
  }

  function deleteEntry(id) {
    var e = entryById(id);
    if (!e) return;
    if (state.timer && state.timer.entryId === id) state.timer = null;
    e.deletedAt = Date.now();
    e.updatedAt = Date.now();
    save();
  }

  /* ================= 导入导出 ================= */
  function exportPayload() {
    var now = Date.now();
    var entries = state.entries.map(function (e) {
      var c = Object.assign({}, e);
      if (c.end == null) c.end = now; // 运行中的条目导出时按当前时刻封口
      return c;
    });
    return {
      app: 'time-tally', schema: SCHEMA, exportedAt: now,
      device: navigator.userAgent.indexOf('Mobile') >= 0 ? 'mobile' : 'desktop',
      cats: clone(state.cats),
      entries: entries
    };
  }

  function mergePayload(target, payload) {
    var rep = { added: 0, updated: 0, skipped: 0, closed: 0, newCats: 0, newSubs: 0, remapped: 0 };
    var incCats = Array.isArray(payload.cats) ? payload.cats : [];
    var incEntries = Array.isArray(payload.entries) ? payload.entries : [];
    var catMap = new Map();
    var subMap = new Map();

    incCats.forEach(function (c) {
      if (!c || !c.id) return;
      var local = null;
      for (var i = 0; i < target.cats.length; i++) {
        if (target.cats[i].id === c.id) { local = target.cats[i]; break; }
      }
      if (!local) {
        for (var j = 0; j < target.cats.length; j++) {
          if (normName(target.cats[j].name) === normName(c.name)) { local = target.cats[j]; break; }
        }
      }
      if (!local) {
        local = { id: uid(), name: String(c.name || '未命名'), color: c.color || '#94a3b8', subs: [] };
        target.cats.push(local);
        rep.newCats++;
      }
      catMap.set(c.id, local.id);

      (c.subs || []).forEach(function (sub) {
        if (!sub || !sub.id) return;
        var ls = null;
        for (var a = 0; a < local.subs.length; a++) {
          if (local.subs[a].id === sub.id) { ls = local.subs[a]; break; }
        }
        if (!ls) {
          for (var b = 0; b < local.subs.length; b++) {
            if (normName(local.subs[b].name) === normName(sub.name)) { ls = local.subs[b]; break; }
          }
        }
        if (!ls) {
          ls = { id: uid(), name: String(sub.name || '未命名') };
          local.subs.push(ls);
          rep.newSubs++;
        }
        subMap.set(sub.id, ls.id);
      });
    });

    var byId = new Map();
    target.entries.forEach(function (e) { byId.set(e.id, e); });
    var now = Date.now();

    incEntries.forEach(function (raw) {
      if (!raw || !raw.id || typeof raw.start !== 'number') return;
      var e = {
        id: raw.id,
        start: raw.start,
        end: (typeof raw.end === 'number') ? raw.end : null,
        catId: catMap.get(raw.catId) || raw.catId,
        subId: subMap.get(raw.subId) || raw.subId,
        note: raw.note || '',
        src: raw.src || 'import',
        createdAt: raw.createdAt || now,
        updatedAt: raw.updatedAt || 0,
        deletedAt: raw.deletedAt || null
      };
      if (e.catId !== raw.catId || e.subId !== raw.subId) rep.remapped++;

      if (target.timer && target.timer.entryId === e.id) { rep.skipped++; return; }

      if (e.end == null) { e.end = e.start; rep.closed++; }

      var cur = byId.get(e.id);
      if (!cur) {
        target.entries.push(e);
        byId.set(e.id, e);
        rep.added++;
      } else if (e.updatedAt > (cur.updatedAt || 0)) {
        Object.assign(cur, e);
        rep.updated++;
      } else {
        rep.skipped++;
      }
    });

    return rep;
  }

  function doExport() {
    var payload = exportPayload();
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var d = new Date();
    var name = 'time-tally-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
    state.meta.lastExportAt = Date.now();
    save();
    renderDataInfo();
    renderExportHint();
    toast('已导出 ' + name);
  }

  function doImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); }
      catch (e) { toast('文件不是有效的 JSON'); return; }
      if (!data || !Array.isArray(data.entries)) { toast('这不是时间账本的导出文件'); return; }

      var rep = mergePayload(state, data);
      save();
      renderAll();
      switchView('record');

      var parts = [];
      if (rep.added) parts.push('新增 ' + rep.added + ' 条');
      if (rep.updated) parts.push('更新 ' + rep.updated + ' 条');
      if (rep.newCats) parts.push('新分类 ' + rep.newCats + ' 个');
      if (rep.newSubs) parts.push('新标签 ' + rep.newSubs + ' 个');
      if (!parts.length) parts.push('没有新的数据');
      var msg = '导入完成：' + parts.join('，');
      if (rep.closed) msg += '。有 ' + rep.closed + ' 条未结束的记录已按 0 分钟导入，请在列表中点开补全时长';
      toast(msg, 4200);
    };
    reader.onerror = function () { toast('读取文件失败'); };
    reader.readAsText(file);
  }

  /* ================= 自动同步 ================= */
  var GIST_FILE = 'time-tally.json';
  var GH_API = 'https://api.github.com';

  function loadSyncCfg() {
    var raw = null;
    try { raw = localStorage.getItem(SYNC_KEY); } catch (e) {}
    if (!raw) return;
    var o = null;
    try { o = JSON.parse(raw); } catch (e) {}
    if (!o || typeof o !== 'object') return;
    if (o.mode === 'lan' || o.mode === 'gist') syncCfg.mode = o.mode;
    if (typeof o.lanUrl === 'string') syncCfg.lanUrl = o.lanUrl;
    if (typeof o.gistToken === 'string') syncCfg.gistToken = o.gistToken;
    if (typeof o.gistId === 'string') syncCfg.gistId = o.gistId;
    if (typeof o.auto === 'boolean') syncCfg.auto = o.auto;
    if (typeof o.rev === 'number') syncCfg.rev = o.rev;
    if (typeof o.lastAt === 'number') syncCfg.lastAt = o.lastAt;
  }

  function saveSyncCfg() {
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch (e) {}
  }

  // 网络传输用的数据：运行中的条目按当前时刻封口，且不含 exportedAt 这类每次都变的字段
  function syncPayload() {
    var now = Date.now();
    var entries = state.entries.map(function (e) {
      var c = Object.assign({}, e);
      if (c.end == null) c.end = now;
      return c;
    });
    return { v: SCHEMA, cats: clone(state.cats), entries: entries };
  }

  // 把远端数据吸收进本地；期间不触发回推，否则会和同步本身形成循环
  function applyRemote(payload) {
    if (!payload || !Array.isArray(payload.entries)) return 0;
    var changed = 0;
    suppressSync = true;
    try {
      var rep = mergePayload(state, payload);
      changed = rep.added + rep.updated + rep.newCats + rep.newSubs;
      if (changed) { save(); renderAll(); }
    } finally {
      suppressSync = false;
    }
    return changed;
  }

  function lanBase() {
    var u = String(syncCfg.lanUrl || '').trim().replace(/\/+$/, '');
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
    return u;
  }

  async function syncLan() {
    var base = lanBase();
    if (location.protocol === 'file:' && !base) {
      throw new Error('本地文件模式没有同步服务，请用启动.cmd 打开');
    }
    for (var attempt = 0; attempt < 3; attempt++) {
      // 带时间戳 + no-store：避免任何一层缓存把旧数据当成最新状态
      var gr = await fetch(base + '/api/sync?t=' + Date.now(), { cache: 'no-store' });
      if (!gr.ok) throw new Error('读取失败 ' + gr.status);
      var remote = await gr.json();

      applyRemote(remote.payload);

      var pr = await fetch(base + '/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ since: remote.rev, payload: syncPayload() })
      });

      if (pr.status === 409) continue; // 别人刚提交过，重新取一遍再合并
      if (!pr.ok) throw new Error('上传失败 ' + pr.status);

      var out = await pr.json();
      syncCfg.rev = out.rev;
      return;
    }
    throw new Error('同步冲突重试多次仍未成功');
  }

  async function ghFetch(pathname, opts) {
    opts = opts || {};
    opts.headers = Object.assign({
      'Authorization': 'token ' + syncCfg.gistToken,
      'Accept': 'application/vnd.github+json'
    }, opts.headers || {});
    var r = await fetch(GH_API + pathname, opts);
    if (!r.ok) {
      var msg = 'GitHub 返回 ' + r.status;
      if (r.status === 401) msg = 'Token 无效或已过期';
      else if (r.status === 403) msg = '被拒绝，可能是限流或 Token 缺少 gist 权限';
      else if (r.status === 404) msg = '找不到这个 Gist，检查 ID 或 Token 权限';
      throw new Error(msg);
    }
    return r.json();
  }

  async function syncGist() {
    if (!syncCfg.gistToken) throw new Error('请先填写 GitHub Token');

    if (syncCfg.gistId) {
      var g = await ghFetch('/gists/' + encodeURIComponent(syncCfg.gistId));
      var file = g.files && g.files[GIST_FILE];
      var content = file && file.content;
      if (file && file.truncated && file.raw_url) {
        var raw = await fetch(file.raw_url);
        if (raw.ok) content = await raw.text();
      }
      if (content) {
        var remote = null;
        try { remote = JSON.parse(content); } catch (e) {}
        if (remote) applyRemote(remote);
      }
    }

    var files = {};
    files[GIST_FILE] = { content: JSON.stringify(syncPayload()) };

    if (!syncCfg.gistId) {
      var created = await ghFetch('/gists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: '时间账本同步数据', public: false, files: files })
      });
      syncCfg.gistId = created.id;
      saveSyncCfg();
    } else {
      await ghFetch('/gists/' + encodeURIComponent(syncCfg.gistId), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: files })
      });
    }
  }

  async function syncNow(quiet) {
    if (DEMO) return;
    if (syncCfg.mode === 'off') {
      if (!quiet) toast('先在设置里开启自动同步');
      return;
    }
    if (syncState.busy) return;
    syncState.busy = true;
    syncState.status = 'syncing';
    renderSyncStatus();
    updateSyncDot();
    try {
      if (syncCfg.mode === 'lan') await syncLan();
      else await syncGist();
      syncCfg.lastAt = Date.now();
      syncState.status = 'ok';
      syncState.error = '';
      saveSyncCfg();
      if (!quiet) toast('已同步');
    } catch (err) {
      syncState.status = 'error';
      syncState.error = (err && err.message) || String(err);
      if (!quiet) toast('同步失败：' + syncState.error, 4200);
    } finally {
      syncState.busy = false;
      renderSyncStatus();
      updateSyncDot();
      renderDataInfo();
    }
  }

  function queueSync() {
    if (DEMO || syncCfg.mode === 'off' || !syncCfg.auto) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncNow(true); }, 4000);
  }

  function ago(ts) {
    var d = Date.now() - ts;
    if (d < 45000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    return Math.floor(d / 86400000) + ' 天前';
  }

  function syncDotClass() {
    if (syncCfg.mode === 'off') return '';
    if (syncState.status === 'syncing') return 'busy';
    if (syncState.status === 'error') return 'err';
    return syncCfg.lastAt ? 'ok' : '';
  }

  function renderSyncStatus() {
    var el = $('#syncStatus');
    if (!el) return;
    if (syncCfg.mode === 'off') { el.innerHTML = ''; return; }
    var txt;
    if (syncState.status === 'syncing') txt = '正在同步…';
    else if (syncState.status === 'error') txt = '<span class="sync-err">同步失败：' + esc(syncState.error) + '</span>';
    else if (syncCfg.lastAt) txt = ago(syncCfg.lastAt) + '同步过';
    else txt = '尚未同步';
    el.innerHTML = '<div class="sync-line"><span class="sync-dot ' + syncDotClass() + '"></span><span class="t">' + txt + '</span></div>';
  }

  function updateSyncDot() {
    var d = $('#syncDot');
    if (d) d.className = 'sync-dot ' + syncDotClass();
  }

  function renderSync() {
    var seg = $('#syncModeSeg');
    if (!seg) return;
    $$('#syncModeSeg button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.syncmode === syncCfg.mode);
    });
    var panel = $('#syncPanel');
    var html = '';

    if (syncCfg.mode === 'off') {
      panel.innerHTML = '<p class="hint">开启后，多台设备会自动交换数据，不用再手动导出导入。</p>';
    } else if (syncCfg.mode === 'lan') {
      html = '<p class="hint">在电脑上运行 <b>启动.cmd</b>，手机连同一个 WiFi 打开同一个地址，两端会自动互相同步。地址留空表示用当前页面的地址。</p>';
      html += '<div class="fld" style="margin-top:12px"><label>同步服务地址</label>' +
        '<input id="syncLanUrl" placeholder="留空＝当前地址" value="' + esc(syncCfg.lanUrl) + '"></div>';
      html += '<div class="actions"><button class="btn main" id="btnSyncNow">立即同步</button></div>';
      panel.innerHTML = html;
    } else {
      html = '<p class="hint">数据存到 GitHub 的一个私有 Gist，换网络也能同步。需要一个带 <b>gist</b> 权限的 Personal Access Token。</p>';
      html += '<div class="fld" style="margin-top:12px"><label>Token</label>' +
        '<input id="syncGistToken" type="password" placeholder="ghp_..." value="' + esc(syncCfg.gistToken) + '"></div>';
      html += '<div class="fld"><label>Gist ID（留空会自动新建）</label>' +
        '<input id="syncGistId" placeholder="留空自动创建" value="' + esc(syncCfg.gistId) + '"></div>';
      html += '<div class="actions"><button class="btn main" id="btnSyncNow">立即同步</button></div>';
      panel.innerHTML = html;
    }
    renderSyncStatus();
  }

  function setSyncMode(m) {
    syncCfg.mode = m;
    syncCfg.lastAt = 0;
    syncState.status = m === 'off' ? 'off' : 'idle';
    syncState.error = '';
    saveSyncCfg();
    renderSync();
    updateSyncDot();
    renderHeader();
    if (m !== 'off') syncNow(true);
  }

  /* ================= 渲染：记录页 ================= */
  var toastTimer = null;
  function toast(msg, ms) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2400);
  }

  function renderHeader() {
    var now = Date.now();
    $('#hdrDate').textContent = fmtDateFull(now);
    var entries = liveEntries();
    var t = sumRange(entries, startOfDay(now), now, now);
    $('#hdrTotal').textContent = fmtDur(t);
    var cnt = entries.filter(function (e) {
      var en = entryEnd(e, now);
      return e.start < now && en > startOfDay(now);
    }).length;
    var dot = syncCfg.mode === 'off' ? '' : '<span class="sync-dot ' + syncDotClass() + '" id="syncDot"></span>';
    $('#hdrRight').innerHTML = dot + (DEMO
      ? '预览模式<br>数据不保存'
      : (cnt ? cnt + ' 条记录' : '今天还没有记录'));
  }

  function renderTimerCard() {
    var now = Date.now();
    var e = activeEntry();
    var dot = $('#tDot'), label = $('#tLabel'), cat = $('#tCat'), time = $('#tTime');
    var btn = $('#btnStart'), btxt = $('#btnStartTxt'), bsub = $('#btnStartSub'), bicon = $('#btnStartIcon');
    var sw = $('#btnSwitch');

    if (e) {
      var c = catOfEntry(e), s = subOfEntry(e);
      dot.classList.add('on');
      label.textContent = '正在记录';
      cat.innerHTML = esc(c.name) + '<span class="sep">·</span>' + esc(s.name);
      time.textContent = fmtHMS(now - e.start);
      time.style.display = '';
      btn.classList.add('running');
      btxt.textContent = '停止';
      bsub.textContent = '结束这一段';
      bicon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2.5"/>';
      sw.hidden = false;
    } else {
      dot.classList.remove('on');
      label.textContent = '未开始';
      cat.textContent = '点下方按钮开始记录';
      time.textContent = '00:00';
      time.style.display = '';
      btn.classList.remove('running');
      btxt.textContent = '开始';
      bsub.textContent = '记一笔';
      bicon.innerHTML = '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/>';
      sw.hidden = true;
    }

    // 超长计时提醒
    if (e) {
      var hours = (now - e.start) / 3600000;
      if (hours >= 8) {
        label.textContent = '已连续 ' + Math.floor(hours) + ' 小时';
        label.style.color = '#d97706';
      } else {
        label.style.color = '';
      }
    } else {
      label.style.color = '';
    }
  }

  function renderRecent() {
    var wrap = $('#recentWrap');
    var list = [];
    for (var i = 0; i < state.meta.recent.length && list.length < 6; i++) {
      var f = findSub(state.meta.recent[i]);
      if (f) list.push(f);
    }
    if (!list.length) { wrap.hidden = true; return; }
    wrap.hidden = false;
    var act = activeEntry();
    $('#recentChips').innerHTML = list.map(function (f) {
      var on = act && act.subId === f.sub.id;
      return '<button class="chip" data-quick="' + esc(f.cat.id) + '|' + esc(f.sub.id) + '" style="--c:' + esc(f.cat.color) + '">' +
        '<i></i>' + esc(f.sub.name) + '<span class="chip-cat">' + esc(f.cat.name) + '</span>' +
        (on ? ' <span style="color:var(--accent)">●</span>' : '') + '</button>';
    }).join('');
  }

  function renderList() {
    var now = Date.now();
    var base = startOfDay(now) + listDay * DAY;
    var from = base, to = base + DAY;
    var all = liveEntries();
    var items = all.filter(function (e) {
      return e.start < to && entryEnd(e, now) > from;
    }).sort(function (a, b) { return b.start - a.start; });

    var label = $('#listDayLabel');
    if (listDay === 0) label.textContent = '今天';
    else if (listDay === -1) label.textContent = '昨天';
    else label.textContent = fmtDayTitle(base);
    $('#dayNext').disabled = listDay >= 0;

    var total = sumRange(items, from, to, now);
    $('#listSum').textContent = items.length ? ('共 ' + fmtDur(total)) : '';

    var box = $('#entryList');
    if (!items.length) {
      box.innerHTML = '<div class="empty">' + (listDay === 0 ? '今天还没有记录<br>点上面的「开始」或「补记」' : '这一天没有记录') + '</div>';
      return;
    }

    box.innerHTML = items.map(function (e) {
      var c = catOfEntry(e), s = subOfEntry(e);
      var s0 = Math.max(e.start, from), e0 = Math.min(entryEnd(e, now), to);
      var live = e.end == null;
      var ov = e.end != null && overlaps(e.start, e.end, e.id).length > 0;
      return '<div class="entry' + (live ? ' entry-live' : '') + '"' + (live ? ' data-live="1"' : '') +
        ' data-open="' + esc(e.id) + '">' +
        '<div class="entry-bar" style="background:' + esc(c.color) + '"></div>' +
        '<div class="entry-main">' +
        '<div class="entry-top">' +
        '<span class="entry-time num">' + fmtClock(s0) + ' – ' + (live ? '现在' : fmtClock(e0)) + '</span>' +
        '<span class="entry-dur num">' + (live ? fmtHMS(now - e.start) : fmtDur(e0 - s0)) + '</span>' +
        '</div>' +
        '<div class="entry-cat"><i style="background:' + esc(c.color) + '"></i>' + esc(c.name) +
        '<span class="sep">·</span>' + esc(s.name) +
        (ov ? ' <span class="warn-dot">重叠</span>' : '') + '</div>' +
        (e.note ? '<div class="entry-note">' + esc(e.note) + '</div>' : '') +
        '</div></div>';
    }).join('');
  }

  /* ================= 渲染：统计页 ================= */
  function renderStats() {
    var now = Date.now();
    var b = rangeBounds(range, now);
    var entries = liveEntries();
    var g = groupRange(entries, b.from, b.to, now, function (e) { return e.catId; });

    $('#statTotal').textContent = fmtDur(g.total);
    var n = 0;
    entries.forEach(function (e) { if (clipMs(e, b.from, b.to, now) > 0) n++; });
    var avg = n ? g.total / n : 0;
    var spanDays = Math.floor((startOfDay(b.to) - startOfDay(b.from)) / DAY) + 1;
    $('#statMeta').textContent = n
      ? (n + ' 条记录 · 单条平均 ' + fmtDur(avg) + ' · 覆盖 ' + spanDays + ' 天')
      : '这个区间还没有记录';

    // 环形图
    var donut = $('#donut'), legend = $('#legend');
    if (!g.total) {
      donut.style.background = 'var(--soft)';
      donut.innerHTML = '';
      legend.innerHTML = '<div style="color:var(--muted);font-size:13px">暂无数据</div>';
    } else {
      var stops = [], acc = 0;
      var top = g.items.slice(0, 6);
      top.forEach(function (it) {
        var c = findCat(it.key) || { name: '未分类', color: '#94a3b8' };
        var pct = it.ms / g.total * 100;
        stops.push(esc(c.color) + ' ' + acc.toFixed(2) + '% ' + (acc + pct).toFixed(2) + '%');
        acc += pct;
      });
      if (acc < 99.99) stops.push('var(--soft) ' + acc.toFixed(2) + '% 100%');
      donut.style.background = 'conic-gradient(' + stops.join(',') + ')';
      donut.innerHTML = '<div class="donut-c"><b>' + esc(fmtDur(g.total)) + '</b><span>' + g.items.length + ' 类</span></div>';
      legend.innerHTML = top.map(function (it) {
        var c = findCat(it.key) || { name: '未分类', color: '#94a3b8' };
        return '<div class="lg-row"><i style="background:' + esc(c.color) + '"></i>' +
          '<span class="lg-n">' + esc(c.name) + '</span>' +
          '<span class="lg-v">' + Math.round(it.ms / g.total * 100) + '%</span></div>';
      }).join('');
    }

    // 分类明细
    var catBars = $('#catBars');
    if (!g.items.length) {
      catBars.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:4px 0">暂无数据</div>';
    } else {
      var max = g.items[0].ms;
      catBars.innerHTML = g.items.map(function (it) {
        var c = findCat(it.key) || { name: '未分类', color: '#94a3b8' };
        var w = max ? (it.ms / max * 100) : 0;
        return '<div class="bar-row"><div class="bar-top"><span class="bn"><i style="background:' + esc(c.color) + '"></i>' + esc(c.name) +
          '</span><span class="bv">' + esc(fmtDur(it.ms)) + '</span></div>' +
          '<div class="track"><div class="fill" style="width:' + w.toFixed(1) + '%;background:' + esc(c.color) + '"></div></div></div>';
      }).join('');
    }

    // 二级排行
    var sg = groupRange(entries, b.from, b.to, now, function (e) { return e.subId || 'none'; });
    var subBars = $('#subBars');
    if (!sg.items.length) {
      subBars.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:4px 0">暂无数据</div>';
    } else {
      var smax = sg.items[0].ms;
      subBars.innerHTML = sg.items.slice(0, 10).map(function (it) {
        var f = findSub(it.key);
        var c = f ? f.cat : { name: '未分类', color: '#94a3b8' };
        var name = f ? f.sub.name : '未标注';
        var w = smax ? (it.ms / smax * 100) : 0;
        return '<div class="bar-row"><div class="bar-top"><span class="bn"><i style="background:' + esc(c.color) + '"></i>' + esc(name) +
          ' <span style="color:var(--muted);font-size:11.5px">' + esc(c.name) + '</span></span>' +
          '<span class="bv">' + esc(fmtDur(it.ms)) + '</span></div>' +
          '<div class="track"><div class="fill" style="width:' + w.toFixed(1) + '%;background:' + esc(c.color) + ';opacity:.55"></div></div></div>';
      }).join('');
    }

    // 近 7 天
    var days = [];
    var today0 = startOfDay(now);
    var maxD = 0;
    for (var i = 6; i >= 0; i--) {
      var d0 = today0 - i * DAY;
      var ms = sumRange(entries, d0, d0 + DAY, now);
      if (ms > maxD) maxD = ms;
      days.push({ ms: ms, ts: d0, today: i === 0 });
    }
    $('#bars7').innerHTML = days.map(function (d) {
      var h = maxD ? Math.max(2, d.ms / maxD * 100) : 0;
      var wd = '日一二三四五六'[new Date(d.ts).getDay()];
      return '<div class="b7"><div class="bt"><div class="bf' + (d.ms ? '' : ' zero') + '" style="height:' + h.toFixed(1) + '%"></div></div>' +
        '<div class="bl' + (d.today ? ' today' : '') + '">' + wd + '</div></div>';
    }).join('');
  }

  /* ================= 渲染：设置页 ================= */
  function renderCatEditor() {
    var box = $('#catEditor');
    box.innerHTML = state.cats.map(function (c) {
      return '<div class="ce-cat">' +
        '<div class="ce-row">' +
        '<input type="color" value="' + esc(c.color) + '" data-catcolor="' + esc(c.id) + '">' +
        '<input class="ce-name" value="' + esc(c.name) + '" data-catname="' + esc(c.id) + '">' +
        '<button class="ce-del" data-catdel="' + esc(c.id) + '">删除</button>' +
        '</div>' +
        '<div class="ce-subs">' +
        c.subs.map(function (s) {
          return '<span class="ce-sub">' + esc(s.name) +
            '<button data-subdel="' + esc(c.id) + '|' + esc(s.id) + '">×</button></span>';
        }).join('') +
        '<button class="ce-add" data-subadd="' + esc(c.id) + '">+ 标签</button>' +
        '</div></div>';
    }).join('');
  }

  function renderDataInfo() {
    var now = Date.now();
    var all = state.entries.length;
    var live = liveEntries().length;
    var bytes = 0;
    try { bytes = (localStorage.getItem(DB_KEY) || '').length; } catch (e) {}
    var kb = (bytes / 1024).toFixed(1);
    $('#dataInfo').innerHTML =
      '<div class="row-btn" style="border-top:0"><span class="rb-l"><span>记录总数</span><span class="rb-s">' + live + ' 条有效 · ' + (all - live) + ' 条在回收站</span></span></div>' +
      '<div class="row-btn"><span class="rb-l"><span>占用空间</span><span class="rb-s">' + kb + ' KB' + (storageOK ? '' : ' · 本地存储不可用') + '</span></span></div>' +
      '<div class="row-btn"><span class="rb-l"><span>当前计时</span><span class="rb-s">' +
      (activeEntry() ? '正在记录' : '无') + '</span></span></div>' +
      (location.protocol === 'file:'
        ? '<div class="row-btn"><span class="rb-l"><span>打开方式</span><span class="rb-s">当前是本地文件模式，数据可能不被浏览器长期保留；建议用「启动.cmd」打开</span></span></div>'
        : '');
  }

  function renderExportHint() {
    var last = state.meta.lastExportAt || 0;
    var el = $('#exportHint');
    if (!last) { el.textContent = '还没有导出过备份，建议现在就导出一次。'; return; }
    var days = Math.floor((Date.now() - last) / DAY);
    if (days <= 0) el.textContent = '上次导出：今天。';
    else if (days === 1) el.textContent = '上次导出：昨天。';
    else el.textContent = '上次导出：' + days + ' 天前。';
    if (days >= 7) el.textContent += ' 数据只存在本机，建议尽快备份。';
  }

  function renderAll() {
    renderHeader();
    renderTimerCard();
    renderRecent();
    renderList();
    renderStats();
    renderCatEditor();
    renderDataInfo();
    renderExportHint();
    renderSyncStatus();
  }

  /* ================= 视图切换 ================= */
  function switchView(name) {
    ['record', 'stats', 'settings'].forEach(function (v) {
      var el = $('#view-' + v);
      if (el) el.hidden = (v !== name);
    });
    $$('.tab').forEach(function (t) {
      t.classList.toggle('on', t.dataset.view === name);
    });
    if (name === 'stats') renderStats();
    window.scrollTo(0, 0);
  }

  /* ================= 抽屉 ================= */
  function openSheet(id) {
    var m = $('#mask'), s = $(id);
    m.hidden = false;
    s.hidden = false;
    requestAnimationFrame(function () {
      m.classList.add('show');
      s.classList.add('show');
    });
  }
  function closeSheets() {
    var m = $('#mask');
    m.classList.remove('show');
    $$('.sheet').forEach(function (s) {
      if (!s.hidden) {
        s.classList.remove('show');
        setTimeout(function () { s.hidden = true; }, 260);
      }
    });
    setTimeout(function () { m.hidden = true; }, 220);
  }

  function renderPicker() {
    var body = $('#pickerBody');
    var html = '';
    var recents = [];
    for (var i = 0; i < state.meta.recent.length && recents.length < 5; i++) {
      var f = findSub(state.meta.recent[i]);
      if (f) recents.push(f);
    }
    if (recents.length) {
      html += '<div class="pk-group"><div class="pk-title">最近使用</div><div class="pk-chips">';
      html += recents.map(function (f) {
        return '<button class="chip" data-pick="' + esc(f.cat.id) + '|' + esc(f.sub.id) + '" style="--c:' + esc(f.cat.color) + '">' +
          '<i></i>' + esc(f.sub.name) + '</button>';
      }).join('');
      html += '</div></div>';
    }
    state.cats.forEach(function (c) {
      html += '<div class="pk-group"><div class="pk-title"><i style="background:' + esc(c.color) + '"></i>' + esc(c.name) + '</div><div class="pk-chips">';
      html += c.subs.map(function (s) {
        return '<button class="chip" data-pick="' + esc(c.id) + '|' + esc(s.id) + '">' + esc(s.name) + '</button>';
      }).join('');
      html += '<button class="chip chip-new" data-newsub="' + esc(c.id) + '">+ 新标签</button>';
      html += '</div></div>';
    });
    body.innerHTML = html;
  }

  function openPicker(mode) {
    pickerMode = mode || 'start';
    renderPicker();
    openSheet('#sheetPicker');
  }

  /* ================= 表单 ================= */
  function fillCatSelect(selectedCatId, selectedSubId) {
    var fc = $('#fCat'), fs = $('#fSub');
    fc.innerHTML = state.cats.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    var cid = selectedCatId || (state.cats[0] && state.cats[0].id);
    fc.value = cid;
    fillSubSelect(cid, selectedSubId);
  }
  function fillSubSelect(catId, selectedSubId) {
    var fs = $('#fSub');
    var c = findCat(catId);
    var subs = c ? c.subs : [];
    fs.innerHTML = subs.map(function (s) {
      return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>';
    }).join('') || '<option value="">（该分类暂无标签）</option>';
    if (selectedSubId) fs.value = selectedSubId;
  }

  function openForm(mode, entryId) {
    editingId = entryId || null;
    var now = Date.now();
    var e = entryId ? entryById(entryId) : null;

    $('#formTitle').textContent = e ? '编辑记录' : '补记一段时间';
    $('#btnFormDel').hidden = !e;

    if (e) {
      $('#fDate').value = dateInputVal(e.start);
      $('#fStart').value = timeInputVal(e.start);
      $('#fEnd').value = timeInputVal(e.end == null ? now : e.end);
      fillCatSelect(e.catId, e.subId);
      $('#fNote').value = e.note || '';
    } else {
      // 默认：最近一段的结束时间 → 现在；没有则现在往前 30 分钟
      var last = liveEntries().filter(function (x) { return x.end != null; })
        .sort(function (a, b) { return b.end - a.end; })[0];
      var end = now, start = now - 30 * 60000;
      if (last && now - last.end < 3 * 3600000) { start = last.end; end = start + 30 * 60000; if (end > now) end = now; }
      $('#fDate').value = dateInputVal(start);
      $('#fStart').value = timeInputVal(start);
      $('#fEnd').value = timeInputVal(end);
      var lastSub = state.meta.recent[0] ? findSub(state.meta.recent[0]) : null;
      if (lastSub) fillCatSelect(lastSub.cat.id, lastSub.sub.id);
      else fillCatSelect(null, null);
      $('#fNote').value = '';
    }
    checkFormWarn();
    openSheet('#sheetForm');
  }

  function readFormTimes() {
    var d = $('#fDate').value;
    var s = $('#fStart').value, en = $('#fEnd').value;
    if (!d || !s || !en) return null;
    var start = parseLocal(d, s);
    var end = parseLocal(d, en);
    if (end <= start) end += DAY; // 跨天
    return { start: start, end: end };
  }

  function checkFormWarn() {
    var t = readFormTimes();
    var w = $('#fWarn');
    if (!t) { w.hidden = true; return; }
    var dur = t.end - t.start;
    var ov = overlaps(t.start, t.end, editingId);
    if (dur > 24 * 3600000) {
      w.hidden = false;
      w.textContent = '时长超过 24 小时，请检查时间是否正确。';
    } else if (ov.length) {
      w.hidden = false;
      w.textContent = '与 ' + ov.length + ' 条已有记录重叠，仍可保存。';
    } else {
      w.hidden = true;
    }
  }

  /* ================= 事件 ================= */
  function bindEvents() {
    // 主导航
    $$('.tab').forEach(function (t) {
      t.addEventListener('click', function () { switchView(t.dataset.view); });
    });

    // 开始 / 停止
    $('#btnStart').addEventListener('click', function () {
      if (activeEntry()) {
        var e = closeTimer(Date.now());
        renderAll();
        toast(e && e.end ? '已记录 ' + fmtDur(e.end - e.start) : '已停止');
      } else {
        openPicker('start');
      }
    });

    $('#btnSwitch').addEventListener('click', function () { openPicker('switch'); });

    // 补记 / 导入 / 导出
    $('#btnManual').addEventListener('click', function () { openForm('manual'); });
    $('#btnExport').addEventListener('click', doExport);
    $('#btnExport2').addEventListener('click', doExport);
    $('#btnImport').addEventListener('click', function () { $('#fileInput').click(); });
    $('#btnImport2').addEventListener('click', function () { $('#fileInput').click(); });
    $('#fileInput').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (f) doImportFile(f);
    });

    // 快捷 chips
    $('#recentChips').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-quick]');
      if (!b) return;
      var p = b.dataset.quick.split('|');
      var act = activeEntry();
      if (act && act.subId === p[1]) { toast('正在记录这一项'); return; }
      startTimer(p[0], p[1]);
      renderAll();
      toast(act ? '已切换并继续计时' : '开始计时');
    });

    // 记录点击 → 编辑
    $('#entryList').addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-open]');
      if (el) openForm('edit', el.dataset.open);
    });

    // 日期翻页
    $$('[data-day]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = parseInt(b.dataset.day, 10);
        if (listDay + d > 0) return;
        listDay += d;
        renderList();
      });
    });

    // 抽屉关闭
    $('#mask').addEventListener('click', closeSheets);
    $$('[data-close]').forEach(function (b) { b.addEventListener('click', closeSheets); });

    // 选择标签
    $('#pickerBody').addEventListener('click', function (ev) {
      var pick = ev.target.closest('[data-pick]');
      if (pick) {
        var p = pick.dataset.pick.split('|');
        var act = activeEntry();
        if (act && act.subId === p[1]) { closeSheets(); toast('正在记录这一项'); return; }
        startTimer(p[0], p[1]);
        closeSheets();
        renderAll();
        toast(act ? '已切换并继续计时' : '开始计时');
        return;
      }
      var add = ev.target.closest('[data-newsub]');
      if (add) {
        var catId = add.dataset.newsub;
        var inp = document.createElement('input');
        inp.className = 'chip-input';
        inp.placeholder = '标签名';
        inp.setAttribute('data-icat', catId);
        add.replaceWith(inp);
        inp.focus();
        inp.addEventListener('keydown', function (ev2) {
          if (ev2.key === 'Enter') {
            ev2.preventDefault();
            commitNewSub(inp);
          } else if (ev2.key === 'Escape') {
            renderPicker();
          }
        });
        inp.addEventListener('blur', function () {
          if (inp.isConnected && inp.value.trim()) commitNewSub(inp);
          else if (inp.isConnected) renderPicker();
        });
      }
    });

    // 表单
    $('#entryForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var t = readFormTimes();
      if (!t) { toast('请填写完整的日期和时间'); return; }
      if (t.end - t.start < 60000) { toast('时长至少 1 分钟'); return; }
      var catId = $('#fCat').value;
      var subId = $('#fSub').value;
      var note = $('#fNote').value.trim();
      if (!catId) { toast('请选择分类'); return; }

      if (editingId) {
        updateEntry(editingId, { start: t.start, end: t.end, catId: catId, subId: subId, note: note });
        // 编辑一条正在计时的记录 = 结束它
        if (state.timer && state.timer.entryId === editingId) state.timer = null;
        editingId = null;
        clampListDay();
        closeSheets();
        renderAll();
        toast('已更新');
      } else {
        addEntry(t.start, t.end, catId, subId, note);
        listDay = 0;
        closeSheets();
        renderAll();
        toast('已补记 ' + fmtDur(t.end - t.start));
      }
    });

    $('#fCat').addEventListener('change', function () { fillSubSelect($('#fCat').value, null); });
    ['#fDate', '#fStart', '#fEnd'].forEach(function (s) {
      $(s).addEventListener('change', checkFormWarn);
      $(s).addEventListener('input', checkFormWarn);
    });

    // 时长快捷
    $('#durQuick').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-dur]');
      if (!b) return;
      var mins = parseInt(b.dataset.dur, 10);
      var d = $('#fDate').value, s = $('#fStart').value;
      if (!d || !s) return;
      var start = parseLocal(d, s);
      var end = start + mins * 60000;
      var d2 = new Date(end);
      var sameDay = dateInputVal(end) === d;
      $('#fEnd').value = timeInputVal(end);
      if (!sameDay) { /* 跨天时保留 24h 制时间，保存时会自动 +1 天 */ }
      checkFormWarn();
    });

    $('#btnFormDel').addEventListener('click', function () {
      if (!editingId) return;
      if (!confirm('删除这条记录？')) return;
      deleteEntry(editingId);
      editingId = null;
      closeSheets();
      renderAll();
      toast('已删除');
    });

    // 统计范围
    $('#rangeSeg').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-range]');
      if (!b) return;
      range = b.dataset.range;
      $$('#rangeSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderStats();
    });

    // 分类编辑
    $('#catEditor').addEventListener('change', function (ev) {
      var t = ev.target;
      if (t.dataset.catname !== undefined) {
        var c = findCat(t.dataset.catname);
        if (c) { c.name = t.value.trim() || '未命名'; save(); renderAll(); }
      } else if (t.dataset.catcolor !== undefined) {
        var c2 = findCat(t.dataset.catcolor);
        if (c2) { c2.color = t.value; save(); renderAll(); }
      }
    });
    $('#catEditor').addEventListener('click', function (ev) {
      var del = ev.target.closest('[data-catdel]');
      if (del) { removeCat(del.dataset.catdel); return; }
      var add = ev.target.closest('[data-subadd]');
      if (add) { addSub(add.dataset.subadd); return; }
      var sd = ev.target.closest('[data-subdel]');
      if (sd) {
        var p = sd.dataset.subdel.split('|');
        removeSub(p[0], p[1]);
      }
    });
    $('#btnAddCat').addEventListener('click', addCat);

    // 自动同步
    $('#syncCard').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-syncmode]');
      if (b) { setSyncMode(b.dataset.syncmode); return; }
      if (ev.target.closest('#btnSyncNow')) syncNow(false);
    });
    $('#syncCard').addEventListener('input', function (ev) {
      var t = ev.target;
      if (t.id === 'syncLanUrl') { syncCfg.lanUrl = t.value.trim(); saveSyncCfg(); }
      else if (t.id === 'syncGistToken') { syncCfg.gistToken = t.value.trim(); saveSyncCfg(); }
      else if (t.id === 'syncGistId') { syncCfg.gistId = t.value.trim(); saveSyncCfg(); }
    });

    // 数据维护
    $('#btnPurge').addEventListener('click', function () {
      var cut = Date.now() - 30 * DAY;
      var before = state.entries.length;
      state.entries = state.entries.filter(function (e) {
        return !(e.deletedAt && e.deletedAt < cut);
      });
      var n = before - state.entries.length;
      save(); renderAll();
      toast(n ? '已清理 ' + n + ' 条' : '没有可清理的记录');
    });

    $('#btnReset').addEventListener('click', function () {
      if (!confirm('确定清空所有记录？其他设备同步后也会一起清空。')) return;
      if (!confirm('再确认一次：记录会被标记为删除，分类会保留。')) return;
      var now = Date.now();
      state.timer = null;
      state.entries.forEach(function (e) {
        if (!e.deletedAt) { e.deletedAt = now; e.updatedAt = now; }
      });
      save(); renderAll();
      if (syncCfg.mode !== 'off') syncNow(true);
      toast('已清空');
    });

    // 键盘快捷键（桌面）
    document.addEventListener('keydown', function (ev) {
      if (ev.target.matches('input,select,textarea')) return;
      if (ev.key === ' ' && !ev.metaKey && !ev.ctrlKey && ev.target === document.body) {
        ev.preventDefault();
        $('#btnStart').click();
      }
      if (ev.key === 'Escape') closeSheets();
    });

    // 回到前台时刷新，并补一次同步
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      renderAll();
      tick();
      if (syncCfg.mode !== 'off' && syncCfg.auto && Date.now() - (syncCfg.lastAt || 0) > 20000) {
        syncNow(true);
      }
    });
  }

  function clampListDay() {
    if (listDay < 0) listDay = 0;
  }

  function commitNewSub(inp) {
    var catId = inp.getAttribute('data-icat');
    var name = inp.value.trim();
    var c = findCat(catId);
    if (!c || !name) { renderPicker(); return; }
    var exists = c.subs.filter(function (s) { return normName(s.name) === normName(name); })[0];
    var sub = exists || { id: uid(), name: name };
    if (!exists) c.subs.push(sub);
    save();
    startTimer(c.id, sub.id);
    closeSheets();
    renderAll();
    toast('已新建标签并开始计时');
  }

  function addSub(catId) {
    var c = findCat(catId);
    if (!c) return;
    var name = prompt('新标签名称');
    if (!name || !name.trim()) return;
    var n = name.trim();
    if (c.subs.some(function (s) { return normName(s.name) === normName(n); })) { toast('已有同名标签'); return; }
    c.subs.push({ id: uid(), name: n });
    save(); renderAll();
  }

  function removeSub(catId, subId) {
    var c = findCat(catId);
    if (!c) return;
    var used = liveEntries().filter(function (e) { return e.subId === subId; }).length;
    if (used && !confirm('该标签下已有 ' + used + ' 条记录，删除后这些记录会显示为「未标注」。继续？')) return;
    c.subs = c.subs.filter(function (s) { return s.id !== subId; });
    state.meta.recent = state.meta.recent.filter(function (x) { return x !== subId; });
    save(); renderAll();
  }

  function removeCat(catId) {
    var c = findCat(catId);
    if (!c) return;
    var used = liveEntries().filter(function (e) { return e.catId === catId; }).length;
    if (state.cats.length <= 1) { toast('至少保留一个分类'); return; }
    if (used && !confirm('该分类下有 ' + used + ' 条记录，删除后这些记录会移到「未分类」。继续？')) return;

    var fallback = state.cats.filter(function (x) {
      return x.id !== catId && normName(x.name) === '未分类';
    })[0];
    if (!fallback && used) {
      fallback = { id: uid(), name: '未分类', color: '#94a3b8', subs: [{ id: uid(), name: '其他' }] };
      state.cats.push(fallback);
    }
    if (fallback) {
      state.entries.forEach(function (e) {
        if (e.catId === catId) {
          e.catId = fallback.id;
          if (!fallback.subs.some(function (s) { return s.id === e.subId; })) {
            e.subId = fallback.subs[0] ? fallback.subs[0].id : '';
          }
          e.updatedAt = Date.now();
        }
      });
    }
    state.cats = state.cats.filter(function (x) { return x.id !== catId; });
    c.subs.forEach(function (s) {
      state.meta.recent = state.meta.recent.filter(function (x) { return x !== s.id; });
    });
    save(); renderAll();
  }

  function addCat() {
    var name = prompt('一级分类名称，例如「阅读」');
    if (!name || !name.trim()) return;
    var n = name.trim();
    if (state.cats.some(function (c) { return normName(c.name) === normName(n); })) { toast('已有同名分类'); return; }
    var palette = ['#4f6df5', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899', '#64748b'];
    state.cats.push({
      id: uid(), name: n,
      color: palette[state.cats.length % palette.length],
      subs: [{ id: uid(), name: '默认' }]
    });
    save(); renderAll();
    toast('已新增分类');
  }

  /* ================= 计时刷新 ================= */
  function tick() {
    var e = activeEntry();
    if (!e) return;
    var now = Date.now();
    var elapsed = now - e.start;
    var t = $('#tTime');
    if (t) t.textContent = fmtHMS(elapsed);
    var lv = document.querySelector('[data-live="1"] .entry-dur');
    if (lv) lv.textContent = fmtHMS(elapsed);

    // 运行中条目会长大，今日合计要跟着走
    if (listDay === 0) {
      var entries = liveEntries();
      var d0 = startOfDay(now);
      $('#hdrTotal').textContent = fmtDur(sumRange(entries, d0, now, now));
      var sum = $('#listSum');
      if (sum) sum.textContent = '共 ' + fmtDur(sumRange(entries, d0, d0 + DAY, now));
    }

    var k = dayKey(now);
    if (k !== lastDayKey) {
      lastDayKey = k;
      renderAll();
    }
  }

  /* ================= 自测 ================= */
  function runSelfTest() {
    var out = [];
    function ok(name, cond) { out.push((cond ? 'PASS' : 'FAIL') + ' ' + name); }

    // 1. 裁剪
    var now = new Date(2026, 4, 10, 12, 0, 0).getTime();
    var e1 = { id: 'a', start: now - 3600000, end: now + 3600000 };
    ok('clip 全部在内', clipMs(e1, now - 7200000, now + 7200000, now) === 7200000);
    ok('clip 左裁剪', clipMs(e1, now - 1800000, now + 7200000, now) === 5400000);
    ok('clip 完全在外', clipMs({ id: 'b', start: now + 7200000, end: now + 9000000 }, now - 7200000, now, now) === 0);

    // 2. 运行中条目用 now 计算
    var live = { id: 'c', start: now - 600000, end: null };
    ok('运行中按 now 计', clipMs(live, now - 7200000, now, now) === 600000);

    // 3. 分组求和 + 排序
    var ents = [
      { id: '1', start: now - 3600000, end: now - 1800000, catId: 'w', subId: 's1' }, // 30 分钟
      { id: '2', start: now - 1800000, end: now, catId: 'w', subId: 's2' },           // 30 分钟
      { id: '3', start: now - 900000, end: now, catId: 'r', subId: 's3' }             // 15 分钟
    ];
    var g = groupRange(ents, now - 7200000, now, now, function (e) { return e.catId; });
    ok('分组总额', g.total === 4500000);
    ok('分组排序降序', g.items[0].key === 'w' && g.items[0].ms === 3600000);

    // 4. 跨天裁剪按天切分
    var night = { id: 'n', start: startOfDay(now) - 3600000, end: startOfDay(now) + 1800000, catId: 'w', subId: 's' };
    ok('跨天今天部分', clipMs(night, startOfDay(now), startOfDay(now) + DAY, now) === 1800000);
    ok('跨天昨天部分', clipMs(night, startOfDay(now) - DAY, startOfDay(now), now) === 3600000);

    // 5. 合并：新增 + 分类按名归并
    var target = {
      cats: [{ id: 'lc', name: '工作', color: '#000', subs: [{ id: 'ls', name: '写代码' }] }],
      entries: [], timer: null
    };
    var payload = {
      cats: [{ id: 'rc', name: '工作', color: '#111', subs: [{ id: 'rs', name: '写代码' }, { id: 'rs2', name: '开会' }] }],
      entries: [
        { id: 'e1', start: now - 1000, end: now, catId: 'rc', subId: 'rs', updatedAt: 10 },
        { id: 'e2', start: now - 1000, end: now, catId: 'rc', subId: 'rs2', updatedAt: 10 }
      ]
    };
    var rep = mergePayload(target, payload);
    ok('合并新增 2 条', rep.added === 2 && target.entries.length === 2);
    ok('分类按名归并未重复', target.cats.length === 1);
    ok('条目 catId 重映射', target.entries[0].catId === 'lc');
    ok('二级标签按名归并', target.entries[0].subId === 'ls');
    ok('新标签被加入', target.cats[0].subs.length === 2);

    // 6. 合并：LWW
    var rep2 = mergePayload(target, {
      cats: [],
      entries: [{ id: 'e1', start: now - 1000, end: now, catId: 'lc', subId: 'ls', note: 'new', updatedAt: 20 }]
    });
    ok('LWW 更新时间较新者胜', target.entries[0].note === 'new' && rep2.updated === 1);
    var rep3 = mergePayload(target, {
      cats: [],
      entries: [{ id: 'e1', start: now - 1000, end: now, catId: 'lc', subId: 'ls', note: 'old', updatedAt: 5 }]
    });
    ok('LWW 旧版本不覆盖', target.entries[0].note === 'new' && rep3.skipped === 1);

    // 7. 导入未结束条目被收缩
    var t2 = { cats: [], entries: [], timer: null };
    var r4 = mergePayload(t2, { cats: [], entries: [{ id: 'z', start: now, end: null, catId: 'x', subId: 'y', updatedAt: 1 }] });
    ok('未结束条目收缩为 0 时长', t2.entries[0].end === t2.entries[0].start && r4.closed === 1);

    // 8. 导入时跳过本地正在计时的条目
    var t3 = {
      cats: [], entries: [{ id: 'act', start: now, end: null, catId: 'x', subId: 'y', updatedAt: 1 }],
      timer: { entryId: 'act' }
    };
    mergePayload(t3, { cats: [], entries: [{ id: 'act', start: now, end: now + 5000, catId: 'x', subId: 'y', updatedAt: 99 }] });
    ok('不覆盖本地运行中的计时', t3.entries[0].end === null);

    // 9. 时长格式化
    ok('fmtDur 小时', fmtDur(3600000) === '1h 00m');
    ok('fmtDur 分钟', fmtDur(900000) === '15m');

    // 10. 跨天补记解析（end 小于 start 时 +1 天）
    var p1 = parseLocal('2026-05-10', '23:30');
    var p2 = parseLocal('2026-05-10', '00:30');
    ok('时间解析', p2 - p1 < 0);

    var html = '<pre id="selftest">' + out.join('\n') + '</pre>';
    document.body.innerHTML = html;
    var fail = out.filter(function (x) { return x.indexOf('FAIL') === 0; }).length;
    document.title = fail ? 'SELFTEST FAIL ' + fail : 'SELFTEST PASS ' + out.length;
    return out;
  }

  if (new URLSearchParams(location.search).has('selftest')) {
    try { runSelfTest(); } catch (err) {
      document.body.innerHTML = '<pre id="selftest">ERROR ' + String(err && err.stack || err) + '</pre>';
    }
    return;
  }

  /* ================= 启动 ================= */
  function boot() {
    loadSyncCfg();
    state = DEMO ? demoState() : load();
    lastDayKey = dayKey(Date.now());
    bindEvents();
    switchView(INIT_VIEW);
    renderAll();
    renderSync();
    renderSyncStatus();
    setInterval(tick, 1000);
    if (activeEntry()) tick();

    if (!storageOK) toast('本地存储不可用，数据刷新后会丢失');

    // 自动同步：启动时补一次，之后每分钟轮询
    if (syncCfg.mode !== 'off' && syncCfg.auto) {
      setTimeout(function () { syncNow(true); }, 1500);
      setInterval(function () {
        if (DEMO || document.hidden) return;
        syncNow(true);
      }, 60000);
    }

    // PWA
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();
</script>
</body>
</html>
